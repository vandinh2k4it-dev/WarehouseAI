# Cấu hình ByteTrack RIÊNG cho bài toán đếm thùng carton — khác với file
# bytetrack.yaml mặc định đi kèm ultralytics.
#
# track_buffer: 150 (~5 giây ở 30fps, mặc định gốc chỉ 30 = ~1 giây) — tăng
# lên sau khi test thật cho thấy đếm THỪA (34, sau đó 32) do thùng bị che
# khuất tạm thời bị gán track ID mới thay vì nhận lại đúng ID cũ.
#
# match_thresh: 0.7 (mặc định gốc 0.8) — nới nhẹ để dễ nhận lại thùng hơn
# khi vị trí xê dịch chút ít sau lúc bị che khuất.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 150
match_thresh: 0.7
fuse_score: True
