<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Đếm hàng — Điện thoại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161B; --surface:#1A2028; --surface-raised:#212933; --border:#2B333D;
    --text:#E7EAEE; --text-muted:#8996A6; --accent:#F5A524; --accent-dim:#3A2E14;
    --success:#2FAE68; --success-dim:#122A1D; --danger:#FF5C5C; --danger-dim:#341A1A;
    --info:#5B8DEF; --info-dim:#182338; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:40px;}
  h1,h2{font-family:'Space Grotesk',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10;}
  header h1{font-size:18px;}
  .conn{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-top:4px;}
  .dot{width:7px;height:7px;border-radius:50%; background:var(--text-muted);}
  .dot.ok{background:var(--success);}
  .dot.bad{background:var(--danger);}

  main{padding:16px; max-width:520px; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .card h2{font-size:14px; text-transform:uppercase; letter-spacing:.3px; color:var(--text-muted); margin-bottom:10px;}

  .bigtoggle{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .bigtoggle button{
    padding:16px 8px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--surface-raised); color:var(--text-muted); font-size:15px; font-weight:600;
    font-family:'Space Grotesk',sans-serif; cursor:pointer;
  }
  .bigtoggle button.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}

  label{display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px;}
  input[type=number], input[type=text], select{
    width:100%; padding:14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-raised); color:var(--text); font-size:16px; margin-bottom:12px;
  }
  button.primary{
    width:100%; border:none; background:var(--accent); color:#1A1200; font-weight:700;
    padding:16px; border-radius:12px; font-size:16px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  }
  button.primary:disabled{opacity:.5;}
  button.ghost{
    width:100%; border:1px solid var(--border); background:transparent; color:var(--text);
    padding:14px; border-radius:12px; font-size:14px; cursor:pointer; margin-top:8px;
  }

  .lineCard{
    background:var(--surface-raised); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .lineCard .name{font-weight:600; font-size:15px;}
  .lineCard .sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .badge{font-size:11px; padding:3px 10px; border-radius:999px; font-weight:600; white-space:nowrap;}
  .badge.not_started{background:var(--info-dim); color:var(--info);}
  .badge.matched, .badge.resolved_override{background:var(--success-dim); color:var(--success);}
  .badge.needs_review{background:var(--danger-dim); color:var(--danger);}
  .badge.counting{background:var(--accent-dim); color:var(--accent);}

  .tapbtn{
    border:1px solid var(--accent); background:var(--accent-dim); color:var(--accent);
    padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; flex:none;
  }

  .countStage{text-align:center;}
  .countStage .target{font-size:14px; color:var(--text-muted); margin-bottom:6px;}
  .countStage .name{font-size:19px; font-weight:700; margin-bottom:18px; font-family:'Space Grotesk',sans-serif;}
  .camBtn{
    display:block; width:100%; padding:26px 12px; border-radius:16px; border:2px dashed var(--accent);
    background:var(--accent-dim); color:var(--accent); text-align:center; font-weight:700; font-size:16px;
    cursor:pointer; margin-bottom:14px;
  }
  .camBtn input{display:none;}
  .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent);
    margin:20px auto; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .resultBox{padding:16px; border-radius:12px; margin-top:10px;}
  .resultBox.ok{background:var(--success-dim); border:1px solid var(--success);}
  .resultBox.warn{background:var(--danger-dim); border:1px solid var(--danger);}
  .resultBox .num{font-size:15px; margin-top:6px;}

  .empty{padding:16px; text-align:center; color:var(--text-muted); font-size:13.5px;}
  .toast{
    position:fixed; left:16px; right:16px; bottom:16px; background:var(--surface-raised);
    border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:13.5px;
    opacity:0; transform:translateY(10px); transition:.2s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.err{border-color:var(--danger); color:var(--danger);}
  .toast.ok{border-color:var(--success); color:var(--success);}

  .backlink{display:inline-block; margin-bottom:10px; font-size:13px; color:var(--text-muted); text-decoration:none;}
</style>
</head>
<body>

<header>
  <h1>📦 Đếm hàng — Điện thoại</h1>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Đang kết nối…</span></div>
</header>

<main>
  <a class="backlink" href="/app/">← Về bảng điều khiển đầy đủ</a>

  <!-- BƯỚC 0: chọn hướng -->
  <div class="bigtoggle">
    <button id="dirImportBtn" class="active" onclick="setDirection('import')">⬇ Nhập hàng</button>
    <button id="dirExportBtn" onclick="setDirection('export')">⬆ Xuất hàng</button>
  </div>

  <!-- NHẬP: chọn phiếu -->
  <div class="card" id="importPickCard">
    <h2>Chọn phiếu nhập</h2>
    <label>Receipt ID</label>
    <input type="number" id="mReceiptId" placeholder="VD: 47" inputmode="numeric" />
    <button class="primary" onclick="loadMobileLines()">Tải danh sách dòng hàng</button>
    <div id="mLinesList" style="margin-top:14px"></div>
  </div>

  <!-- XUẤT: chọn sản phẩm -->
  <div class="card" id="exportPickCard" style="display:none">
    <h2>Xuất hàng — chọn sản phẩm</h2>
    <label>Sản phẩm</label>
    <select id="mExportProduct"><option value="">— Chọn sản phẩm —</option></select>
    <label>Số lượng dự kiến xuất</label>
    <input type="number" id="mExportQty" placeholder="20" inputmode="numeric" />
    <button class="primary" onclick="beginMobileExport()">Bắt đầu đếm</button>
  </div>

  <!-- ĐANG ĐẾM: quay video -->
  <div class="card" id="countCard" style="display:none">
    <div class="countStage">
      <div class="target">Cần khớp <span class="mono" id="cTarget">0</span></div>
      <div class="name" id="cName">—</div>

      <label class="camBtn" id="camBtnLabel">
        🎥 Chạm để quay video đếm hàng
        <input type="file" accept="video/*" capture="environment" id="videoInput" onchange="onVideoSelected(event)" />
      </label>
      <button class="ghost" onclick="cancelCounting()">Huỷ, quay lại danh sách</button>

      <div id="uploadStatus"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let API = (location.protocol.startsWith("http")) ? location.origin : "http://localhost:8000";
let direction = "import";
let currentSession = null; // { id, expected_quantity, label, isExport }
let productsCache = [];

function toast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove("show"), 3500);
}

async function api(path, opts={}){
  const res = await fetch(API + path, opts);
  if(!res.ok){
    let detail = res.statusText;
    try{ detail = (await res.json()).detail || detail; }catch(e){}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return res.json();
}

async function checkHealth(){
  const dot = document.getElementById("connDot");
  const txt = document.getElementById("connText");
  try{
    await api("/health");
    dot.className = "dot ok"; txt.textContent = "Đã kết nối — " + API;
    loadProductsForExport();
  }catch(e){
    dot.className = "dot bad"; txt.textContent = "Không kết nối được API";
  }
}
checkHealth();

function setDirection(dir){
  direction = dir;
  document.getElementById("dirImportBtn").classList.toggle("active", dir === "import");
  document.getElementById("dirExportBtn").classList.toggle("active", dir === "export");
  document.getElementById("importPickCard").style.display = dir === "import" ? "" : "none";
  document.getElementById("exportPickCard").style.display = dir === "export" ? "" : "none";
  document.getElementById("countCard").style.display = "none";
}

async function loadProductsForExport(){
  try{
    productsCache = await api("/products");
    const sel = document.getElementById("mExportProduct");
    sel.innerHTML = `<option value="">— Chọn sản phẩm —</option>` +
      productsCache.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  }catch(e){}
}

// ---------- NHẬP ----------
const STATUS_LABEL = {
  not_started: "chưa đếm", counting: "đang đếm", matched: "đã khớp",
  needs_review: "lệch — kiểm tra sau", resolved_override: "đã xử lý",
};

async function loadMobileLines(){
  const receiptId = parseInt(document.getElementById("mReceiptId").value);
  const box = document.getElementById("mLinesList");
  if(!receiptId){ toast("Nhập Receipt ID trước", "err"); return; }
  box.innerHTML = `<div class="empty">Đang tải…</div>`;
  try{
    const lines = await api(`/receipts/${receiptId}/lines-progress`);
    if(!lines.length){ box.innerHTML = `<div class="empty">Phiếu không có dòng hàng nào</div>`; return; }
    box.innerHTML = lines.map(l => `
      <div class="lineCard">
        <div>
          <div class="name">${l.product_name_raw}</div>
          <div class="sub">Cần ${l.declared_quantity}${l.counted_quantity != null ? " · camera đếm " + l.counted_quantity : ""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${l.counting_status}">${STATUS_LABEL[l.counting_status] || l.counting_status}</span>
          ${(l.counting_status === "not_started" || l.counting_status === "needs_review") ?
            `<button class="tapbtn" onclick='beginMobileImport(${JSON.stringify(l)})'>Đếm</button>` : ""}
        </div>
      </div>`).join("");
  }catch(e){
    box.innerHTML = `<div class="empty">Lỗi: ${e.message}</div>`;
  }
}

async function beginMobileImport(line){
  try{
    const session = await api("/camera-sessions/start-import", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ receipt_line_item_id: line.line_id })
    });
    showCountCard(session, line.declared_quantity, line.product_name_raw, false);
  }catch(e){
    toast("Lỗi: " + e.message, "err");
  }
}

// ---------- XUẤT ----------
async function beginMobileExport(){
  const productId = parseInt(document.getElementById("mExportProduct").value);
  const qty = parseFloat(document.getElementById("mExportQty").value);
  if(!productId || !qty){ toast("Chọn sản phẩm và nhập số lượng", "err"); return; }
  const productName = document.getElementById("mExportProduct").selectedOptions[0].textContent;
  try{
    const session = await api("/camera-sessions/start-export", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ product_id: productId, expected_quantity: qty })
    });
    showCountCard(session, qty, productName, true);
  }catch(e){
    toast("Lỗi: " + e.message, "err");
  }
}

// ---------- Màn hình đếm + quay video ----------
function showCountCard(session, expectedQty, name, isExport){
  currentSession = { id: session.id, expected_quantity: expectedQty, label: name, isExport };
  document.getElementById("importPickCard").style.display = "none";
  document.getElementById("exportPickCard").style.display = "none";
  document.getElementById("countCard").style.display = "";
  document.getElementById("cTarget").textContent = expectedQty;
  document.getElementById("cName").textContent = name;
  document.getElementById("uploadStatus").innerHTML = "";
  document.getElementById("videoInput").value = "";
}

function cancelCounting(){
  currentSession = null;
  document.getElementById("countCard").style.display = "none";
  setDirection(direction);
}

async function onVideoSelected(event){
  const file = event.target.files[0];
  if(!file || !currentSession) return;

  const status = document.getElementById("uploadStatus");
  status.innerHTML = `<div class="spinner"></div><div class="empty">Đang tải video lên & đếm — có thể mất chút thời gian…</div>`;

  const fd = new FormData();
  fd.append("file", file);
  fd.append("threshold_pct", "0.02");

  try{
    const res = await fetch(`${API}/camera-sessions/${currentSession.id}/count-video`, { method:"POST", body: fd });
    if(!res.ok){
      const err = await res.json().catch(()=>({detail:res.statusText}));
      throw new Error(err.detail);
    }
    const result = await res.json();
    const ok = result.session.status === "completed";
    status.innerHTML = `
      <div class="resultBox ${ok ? "ok" : "warn"}">
        <div style="font-weight:700">${ok ? "✅ Khớp" : "⚠️ Lệch — cần kiểm tra sau"}</div>
        <div class="num mono">Camera đếm: ${result.session.counted_quantity} / cần ${currentSession.expected_quantity}</div>
        <div style="margin-top:8px;font-size:13px">${result.message}</div>
      </div>
      <button class="primary" style="margin-top:14px" onclick="backToList()">Xong — chọn loại tiếp theo</button>`;
    toast(result.message, ok ? "ok" : "err");
  }catch(e){
    status.innerHTML = `<div class="empty" style="color:var(--danger)">Lỗi: ${e.message}</div>
      <button class="ghost" onclick="onVideoSelected({target:{files:[document.getElementById('videoInput').files[0]]}})">Thử lại</button>`;
  }
}

function backToList(){
  const wasExport = currentSession?.isExport;
  currentSession = null;
  document.getElementById("countCard").style.display = "none";
  if(wasExport){
    setDirection("export");
    document.getElementById("mExportQty").value = "";
  }else{
    setDirection("import");
    loadMobileLines();
  }
}
</script>

</body>
</html>
